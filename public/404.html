<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>RARMATRIX Technologies</title>
    <script>
      const projectBase = '/rarmatrix-app/';
      const routePath = window.location.pathname.startsWith(projectBase)
        ? window.location.pathname.slice(projectBase.length)
        : window.location.pathname.replace(/^\/+/, '');
      const originalRoute = `/${routePath}${window.location.search}${window.location.hash}`;
      window.location.replace(`${projectBase}?p=${encodeURIComponent(originalRoute)}`);
    </script>
  </head>
  <body></body>
</html>
